spring.datasource.hikari.connectionTimeout=20000
spring.datasource.hikari.maximumPoolSize=2

management.endpoint.prometheus.enabled=true
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.tracing.sampling.probability=1

## PostgreSQL
spring.datasource.url=jdbc:postgresql://reservation-system-db.c9qkuoi2mhm3.ap-south-1.rds.amazonaws.com:5432/reservationsystem
spring.datasource.username=${database.username}
spring.datasource.password=${database.password}

spring.kafka.bootstrap-servers=${kafka.bootstrap_servers}
spring.kafka.properties.basic.auth.credentials.source=USER_INFO
spring.kafka.properties.basic.auth.user.info=${kafka.auth_user_info}
spring.kafka.properties.security.protocol=SASL_SSL
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username='${confluent.client_username}' password='${confluent.client_password}';
spring.kafka.properties.sasl.mechanism=PLAIN
spring.kafka.properties.session.timeout.ms=45000
spring.kafka.producer.acks=all
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.IntegerSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

application.redis.host=redis-16194.c305.ap-south-1-1.ec2.redns.redis-cloud.com
application.redis.port=16194
application.redis.username=${application.redis.username}
application.redis.password=${application.redis.password}
application.webclient.baseUrl=http://localhost:61003/
application.webclient.roomDetailsUrl=/hotel-management-service/api/v1/roomDetails
application.webclient.paymentUrl=/payment-service/api/v1/pay
application.webclient.lockRoomForReservationUrl=/hotel-management-service/api/v1/lockRoomForReservation
application.webclient.unlockRoomUrl=/hotel-management-service/api/v1/unlockRoom
application.webclient.reservationUrl=/hotel-management-service/api/v1/reserveRoom
application.webclient.refundUrl=/payment-service/api/v1/refund
application.rest.baseUrl=http://localhost:61003
application.rest.validateUrl=/customer-service/api/v1/validate